<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WWSTA · 个人主页</title>
  <meta name="description" content="WWSTA 的个人主页：数据统计、技术栈、项目（热门/原创/克隆）与评论区（基于 GitHub Issues）。">
  <meta name="color-scheme" content="light dark">
  <!-- 主题初始化：在 CSS 加载前应用，避免刷新闪烁 -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <!-- 网页图标：使用 WWSTA 的 GitHub 头像 -->
  <link rel="icon" type="image/png" href="assets/avatar.png">
  <link rel="apple-touch-icon" href="assets/avatar.png">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

  <div class="container">

    <!-- Hero：头像 + 打字机 + 概要信息 -->
    <section class="hero" aria-label="个人简介">
      <img class="hero-avatar" src="https://avatars.githubusercontent.com/u/228279328?v=4" alt="WWSTA 的头像"
           width="160" height="160" onerror="this.onerror=null;this.src='assets/avatar.png'">
      <div class="hero-body">
        <div class="hero-title-row">
          <h1 class="hero-name">WWSTA</h1>
          <span class="hero-badge">👋 个人主页</span>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换主题" title="切换主题"></button>
        </div>
        <p class="typing-line" aria-label="欢迎语">
          <span id="typing-text"></span><span class="typing-cursor" aria-hidden="true"></span>
        </p>
        <p class="hero-meta" id="hero-meta"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" id="follow-btn" href="https://github.com/WWSTA" target="_blank" rel="noopener">
            <svg class="octicon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M2 5.5a3.5 3.5 0 1 1 5.898 2.549 5.508 5.508 0 0 1 3.034 4.084.75.75 0 1 1-1.482.235 4 4 0 0 0-7.9 0 .75.75 0 0 1-1.482-.236A5.507 5.507 0 0 1 3.102 8.05 3.493 3.493 0 0 1 2 5.5ZM11 4a3.001 3.001 0 0 1 2.22 5.018 5.01 5.01 0 0 1 2.56 3.012.749.749 0 0 1-.885.954.752.752 0 0 1-.549-.514 3.507 3.507 0 0 0-2.522-2.372.75.75 0 0 1-.578-.73v-.353a.75.75 0 0 1 .432-.678A1.5 1.5 0 0 0 11 5.5.75.75 0 0 1 11 4Zm-5.5-.5a2 2 0 1 0-.001 3.999A2 2 0 0 0 5.5 3.5Z"></path></svg>
            Follow @WWSTA
          </a>
          <a class="btn btn-outline" href="https://github.com/WWSTA?tab=repositories" target="_blank" rel="noopener">
            <svg class="octicon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"></path></svg>
            查看全部仓库
          </a>
        </div>
      </div>
    </section>

    <!-- 数据统计（GitHub API 本地计算，替代 metrics 面板） -->
    <section class="section" aria-label="数据统计">
      <h2 class="section-title">📊 数据统计</h2>
      <div class="stats-grid" id="stats-grid"></div>
    </section>

    <!-- 语言分布（本地渲染） -->
    <section class="section" aria-label="语言分布">
      <h2 class="section-title">📈 语言分布</h2>
      <div class="lang-bar" id="lang-bar" role="img" aria-label="仓库语言分布"></div>
      <ul class="lang-legend" id="lang-legend"></ul>
    </section>

    <!-- 技术栈（skillicons.dev，加载失败自动降级为文字徽章） -->
    <section class="section" aria-label="技术栈">
      <h2 class="section-title">🧑‍💻 技术栈</h2>
      <div class="skills-wrap" id="skills-wrap">
        <img id="skills-img" src="https://skillicons.dev/icons?i=js,html,css,py,kotlin&theme=light"
             alt="技术栈图标：JavaScript、HTML、CSS、Python、Kotlin" loading="lazy">
      </div>
    </section>

    <!-- 提交记录动画（由 .github/workflows/snake.yml 每日生成；未生成或无法访问时整节自动隐藏，说明见 README） -->
    <section class="section" id="snake-section" aria-label="提交记录">
      <h2 class="section-title">📅 提交记录</h2>
      <img class="snake-img" id="snake-img"
           src="https://raw.githubusercontent.com/WWSTA/wwsta.github.io/output/github_contribution_grid_snake.svg"
           alt="GitHub 提交记录动画" loading="lazy">
    </section>

    <!-- 项目：热门 / 我的 / 克隆 -->
    <section class="section" aria-label="项目">
      <h2 class="section-title">📦 项目</h2>
      <nav class="tabs" id="tabs" role="tablist" aria-label="项目分类">
        <button class="tab is-selected" id="tab-hot" role="tab" aria-selected="true" data-tab="hot" type="button">
          <svg class="octicon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Zm0 2.445L6.615 5.5a.75.75 0 0 1-.564.41l-3.097.45 2.24 2.184a.75.75 0 0 1 .216.664l-.528 3.084 2.769-1.456a.75.75 0 0 1 .698 0l2.77 1.456-.53-3.084a.75.75 0 0 1 .216-.664l2.24-2.183-3.096-.45a.75.75 0 0 1-.564-.41L8 2.694Z"></path></svg>
          <span>热门项目</span>
          <span class="Counter" id="count-hot">0</span>
        </button>
        <button class="tab" id="tab-mine" role="tab" aria-selected="false" data-tab="mine" type="button">
          <svg class="octicon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"></path></svg>
          <span>我的项目</span>
          <span class="Counter" id="count-mine">0</span>
        </button>
        <button class="tab" id="tab-forks" role="tab" aria-selected="false" data-tab="forks" type="button">
          <svg class="octicon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.878a2.25 2.25 0 1 1 1.5 0v.878a2.25 2.25 0 0 1-2.25 2.25h-1.5v2.128a2.251 2.251 0 1 1-1.5 0V8.5h-1.5A2.25 2.25 0 0 1 3.5 6.25v-.878a2.25 2.25 0 1 1 1.5 0ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm6.75.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm-3 8.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"></path></svg>
          <span>克隆项目</span>
          <span class="Counter" id="count-forks">0</span>
        </button>
      </nav>

      <p class="update-status" id="update-status" hidden></p>
      <div id="repo-area" aria-live="polite"></div>
    </section>

    <!-- 文章与讨论：发布在其他社区的内容（静态数据，js/data.js） -->
    <section class="section" aria-label="文章与讨论">
      <h2 class="section-title">📝 文章与讨论</h2>
      <div class="article-list" id="article-list"></div>
    </section>

    <!-- 评论区（utterances / GitHub Issues；由 app.js 按当前主题注入；未安装或无法访问时整节自动隐藏，说明见 README） -->
    <section class="comments section" id="comments" aria-label="评论区">
      <h2 class="section-title">💬 评论区</h2>
      <div class="utterances-container" id="utterances-container"></div>
    </section>

  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>© 2026 WWSTA</span>
      <span class="footer-sep" aria-hidden="true">·</span>
      <span>项目数据来自 <a href="https://docs.github.com/zh/rest" target="_blank" rel="noopener">GitHub API</a></span>
    </div>
  </footer>

  <script src="js/articles.js?v=3"></script>
  <script src="js/data.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
