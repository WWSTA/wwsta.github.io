# 贪吃蛇贡献动画：每天自动生成并发布到 output 分支
# 参考 github.com/Platane/snk（MIT）与 wmuj/github-profile-tutorial 教程
# 首次使用：推送到 GitHub 后，在仓库 Actions 页面手动 Run workflow 一次
name: generate snake

on:
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 00:00（北京时间 08:00）
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 生成贪吃蛇 SVG（浅色 + 深色两份）
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: WWSTA
          outputs: |
            dist/github_contribution_grid_snake.svg
            dist/github_contribution_grid_snake_dark.svg

      # 发布到 output 分支（页面引用 raw.githubusercontent.com/.../output/... 路径）
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
